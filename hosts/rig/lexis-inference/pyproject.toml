[project]
name = "lexis-rig-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lexis-inference",
  "dots.tts==0.3.1",
  "torch==2.8.0+cu128",
  "torchaudio==2.8.0+cu128",
]

[tool.uv]
package = false

[tool.uv.sources]
lexis-inference = { path = "lexis-inference" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
