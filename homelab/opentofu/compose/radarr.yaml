# Pinned media stack, managed by OpenTofu as a Synology Container Manager
# project (see ../synology.tf). Bump a tag here, then `nh darwin switch` and
# `homelab-tofu-apply` to roll it out. Data lives in the bind mounts below, so
# recreating containers is safe.
services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls316
    container_name: radarr
    environment:
      - PUID=1031
      - PGID=100
      - UMASK_SET=022
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/docker/radarr-config:/config
      - /volume2/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls273
    container_name: sabnzbd
    environment:
      - PUID=1031
      - PGID=100
      - UMASK_SET=022
      - TZ=America/Los_Angeles
    volumes:
      - /volume2/data/usenet:/data/usenet
      - /volume1/docker/sabnzbd-config:/config
    ports:
      - 8080:8080
      - 9090:9090
    restart: unless-stopped

  bazarr:
    image: ghcr.io/yodahuang/bazarr-bilingual:v1.6.1-bilingual.6
    container_name: bazarr
    environment:
      - PUID=1031
      - PGID=100
      - UMASK_SET=022
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/docker/bazarr-config:/config
      - /volume2/data:/data
    ports:
      - 6767:6767
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls324
    container_name: sonarr
    environment:
      - PUID=1031
      - PGID=100
      - UMASK_SET=022
      - TZ=America/Los_Angeles
    volumes:
      - /volume1/docker/sonarr-config:/config
      - /volume2/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  notifiarr:
    image: golift/notifiarr:0.9.7
    container_name: notifiarr
    hostname: Dumpster
    volumes:
      - /volume1/docker/notifiarr-config:/config
    ports:
      - 5454:5454
    restart: unless-stopped
